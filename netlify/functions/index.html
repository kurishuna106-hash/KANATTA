const getStreak=()=>{try{const e=JSON.parse(localStorage.getItem("kanatta_diary")||"[]");if(!e.length)return 0;const t=new Date();let s=0;for(let i=0;i<60;i++){const d=new Date(t);d.setDate(d.getDate()-i);if(e.some(x=>new Date(x.id).toDateString()===d.toDateString()))s++;else if(i>0)break;}return s;}catch{return 0;}};

  <button onClick={onClick} disabled={disabled} style={{background:disabled?"#E0E0E0":outline?"transparent":C.red,color:disabled?"#999":outline?C.red:"#fff",border:outline?`2px solid ${C.red}`:"none",borderRadius:50,padding:"14px 24px",fontSize:"0.95rem",fontWeight:700,cursor:disabled?"not-allowed":"pointer",fontFamily:"Montserrat,sans-serif",transition:"all 0.2s",boxShadow:disabled||outline?"none":"0 4px 14px rgba(232,25,44,0.3)",...style}}>{children}</button>
);

const Card=({children,style={},onClick})=>(
  <div onClick={onClick} style={{background:"#fff",borderRadius:20,padding:"20px",boxShadow:"0 2px 16px rgba(0,0,0,0.08)",border:"1px solid #E0E0E0",...style}}>{children}</div>
